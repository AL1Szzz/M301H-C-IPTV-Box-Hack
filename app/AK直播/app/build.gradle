plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orchard.livetv'
    compileSdk 33
    buildToolsVersion '33.0.1'

    defaultConfig {
        applicationId 'app.orchard.livetv'
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 无第三方依赖：全部使用 Android framework API，保证 API 19 (Android 4.4) 可用
}
