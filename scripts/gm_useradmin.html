function setTime()
{

times = parseInt(63877,10);
timestamp = parseInt(63878,10);
if(1 == firstflag)
{
if(times + 60 > timestamp)
{
maxtime = Math.min(60, times + 60 - timestamp);
}
else
{
maxtime = 0;
}
}

{

}
}
else
{

firstflag = 0;
}
}
}

function getIEVersion()
{

var isEdge = userAgent.indexOf("Windows NT 6.1; Trident/7.0;") > -1 && !isIE;
if(isIE)
{
var reIE = new RegExp("MSIE (\\d+\\.\\d+);");
reIE.test(userAgent);
var fIEVersion = parseFloat(RegExp["$1"]);
if(fIEVersion == 7)
{ return "0";}
else if(fIEVersion == 8)
{ return "0";}
else if(fIEVersion == 9)
{ return "0";}
else if(fIEVersion == 10)
{ return "0";}
else if(fIEVersion == 11)
{
return "1";}
else
{ return "0"}
}
else if(isEdge)
{
return "1";
}
else
{
return "1";
}
}
